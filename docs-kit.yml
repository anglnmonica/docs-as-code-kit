# docs-kit.yml
#
# The one file you edit to set up the docs kit for your project.
# The automated checks and the AI skills both read this file, so the kit
# adapts to your product instead of anyone else's.
#
# How to use it:
#   1. Copy this file to the root of your docs repository.
#   2. Replace every value marked "<...>". Keep the defaults you agree with.
#   3. Turn domain packs on or off under "packs".
#
# Lines that start with "#" are comments. They explain each setting and
# are ignored by the kit.

# ---------------------------------------------------------------------------
# Your product and readers
# The AI skills use this section to decide tone, depth, and examples.
# ---------------------------------------------------------------------------
project:
  product_name: "<Your Product>"           # Exact customer-facing name and casing.
  description: "<One sentence: what the product does and for whom.>"
  docs_url: "<https://docs.example.com>"   # Where the published docs live.
  audience:
    primary: "<network administrators>"    # Who reads the docs most.
    technical_level: intermediate          # beginner | intermediate | expert
    also_reads: []                         # Optional, such as [installers, sales engineers].

# ---------------------------------------------------------------------------
# Your docs repository
# The checks use this section to find your files and build your site.
# ---------------------------------------------------------------------------
repository:
  content_path: docs/                      # Folder that holds your docs.
  format: markdown                         # markdown | mdx | asciidoc
  site_generator: none                     # jekyll | docusaurus | mkdocs | none
  build_command: ""                        # Such as "bundle exec jekyll build". Leave empty if none.
  build_output: ""                         # Folder the build creates, such as _site/ or build/.
  base_path: ""                            # The folder the site is published under, such as
                                           # /my-docs/ for https://example.github.io/my-docs/.
                                           # Leave empty if the site is at the root of its domain.
  default_branch: main

# ---------------------------------------------------------------------------
# Writing style
# ---------------------------------------------------------------------------
style:
  base: google                             # google | microsoft. The style guide the rules follow.
  voice:
    person: second                         # second ("you") | first ("I", "we"). Product docs use second.
    contractions: true                     # Allow "don't", "it's".
  # Your own word list: product names and terms the spelling and style
  # checks should accept, and words they should flag. See terms.yml.
  terminology_file: terms.yml

# ---------------------------------------------------------------------------
# Domain packs
# Extra rules for a field. Turn on the packs that match your product.
# Each pack adds style rules, terms, and tests that prove its rules work.
# ---------------------------------------------------------------------------
packs:
  telecom: false   # Acronym-first definitions, such as "CBRS (Citizens Broadband
                   # Radio Service)", plus telecom terms, units, and unit spacing.
  # More packs can be added here later.

# ---------------------------------------------------------------------------
# Automated checks
# These run on every pull request. Each one can be turned off.
# ---------------------------------------------------------------------------
checks:
  style:
    enabled: true
    tool: vale
    fail_on: error                         # error | warning. Lower levels are posted as suggestions only.
  spelling:
    enabled: true
    tool: codespell
    ignore_words: []                       # Words that are spelled correctly but get flagged, such as [ue].
  links:
    enabled: true
    tool: lychee
    weekly: true                           # Also check links every Monday, since outside pages can break.
    exclude: []                            # Sites that block link checkers, such as ["linkedin\\.com"].
  accuracy:
    enabled: false                         # Needs a built site. Turn on after setting build_command.
    tool: doc-detective
    tests_path: .github/doc-detective/tests/
  rule_tests:
    enabled: true                          # Proves each custom style rule still catches what it should.

# ---------------------------------------------------------------------------
# Document types
# Templates the kit provides. The AI skills use the matching template when
# you ask for a new document. Turn off the ones your team doesn't write.
# ---------------------------------------------------------------------------
doc_types:
  installation_guide: true
  configuration_guide: true
  how_to: true
  troubleshooting: true
  release_notes: true
  api_reference: false                     # Turn on if you have an API. Needs sources.api_spec.
  white_paper: false
  solution_brief: false
  templates_path: templates/

# ---------------------------------------------------------------------------
# Sources of truth
# Where the AI skills check facts. A claim counts as verified only if it's
# found in one of these. Anything else is marked for a person to confirm.
# ---------------------------------------------------------------------------
sources:
  api_spec: ""                             # Path or URL to an OpenAPI file, if you have one.
  ui_strings: ""                           # Where exact button and menu labels are defined.
  product_specs: []                        # Specs, tickets, or release plans, as paths or URLs.
  subject_matter_experts: []               # Roles to ask, such as ["RF engineering lead"]. No personal details.

# ---------------------------------------------------------------------------
# AI skills
# Rules every AI skill follows, whatever it's writing or reviewing.
# ---------------------------------------------------------------------------
ai:
  never_invent: true                       # Never make up facts, settings, values, or links.
  unverified_marker: "[unverified]"        # Added after any claim the AI couldn't confirm.
  review_checklist: checklists/review.md   # What the review skill checks a draft against.
  verify_rules: checklists/verify.md       # How both skills check facts.
  deliver_as: pull_request                 # pull_request | files
